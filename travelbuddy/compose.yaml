services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travelbuddy}
      POSTGRES_USER: ${POSTGRES_USER:-travelbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travelbuddy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - travelbuddy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s

volumes:
  travelbuddy-postgres:
