<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelBuddy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f4f4;
    color: #222;
    line-height: 1.5;
  }

  .wrap { max-width: 900px; margin: 0 auto; padding: 20px; }

  header {
    background: #1d4ed8;
    color: #fff;
    padding: 16px 0;
    margin-bottom: 24px;
  }
  header .wrap { padding-top: 0; padding-bottom: 0; }
  header h1 { font-size: 22px; }
  header p { font-size: 14px; color: #bfdbfe; }

  section {
    background: #fff;
    border: 1px solid #ccc;
    padding: 20px;
    margin-bottom: 20px;
  }
  section h2 {
    font-size: 17px;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid #1d4ed8;
  }

  label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  input, select {
    width: 100%;
    padding: 8px;
    border: 1px solid #999;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
  }
  .row { display: flex; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }

  .vibes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .vibes label {
    font-weight: normal;
    border: 1px solid #999;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 14px;
    background: #fff;
  }
  .vibes input { display: none; }
  .vibes label.on { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }

  button {
    background: #1d4ed8;
    color: #fff;
    border: none;
    padding: 10px 22px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { background: #1e40af; }
  button:disabled { background: #999; cursor: default; }

  .error {
    background: #dc2626;
    color: #fff;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 14px;
    display: none;
  }

  .brief {
    background: #fef9c3;
    border: 1px solid #ca8a04;
    padding: 12px;
    font-size: 14px;
    margin-bottom: 16px;
  }

  .agent-status { font-size: 14px; margin-bottom: 4px; }
  .agent-status .dot { display: inline-block; width: 10px; height: 10px; margin-right: 6px; background: #999; }
  .agent-status.working .dot { background: #ca8a04; }
  .agent-status.done .dot { background: #16a34a; }
  .agent-status.failed .dot { background: #dc2626; }

  .agent-group { margin-top: 18px; }
  .agent-group h3 { font-size: 15px; margin-bottom: 8px; }

  .card {
    border: 1px solid #ccc;
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    background: #fff;
  }
  .card:hover { border-color: #1d4ed8; }
  .card.selected { border: 2px solid #16a34a; background: #f0fdf4; }
  .card .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .card .name { font-weight: bold; font-size: 15px; }
  .card .badge {
    background: #1d4ed8; color: #fff;
    font-size: 12px; padding: 2px 8px;
    white-space: nowrap;
  }
  .card .meta { font-size: 13px; color: #555; margin: 4px 0; }
  .card .desc { font-size: 14px; margin-bottom: 4px; }
  .card .why { font-size: 13px; color: #555; }
  .card .pick { font-size: 13px; font-weight: bold; color: #16a34a; margin-top: 6px; }
  .card .match { font-size: 13px; color: #16a34a; margin-top: 4px; }
  .card .conflict {
    display: inline-block;
    background: #dc2626; color: #fff;
    font-size: 12px; padding: 2px 8px;
    margin-top: 6px;
  }

  .day {
    border: 1px solid #ccc;
    margin-bottom: 14px;
  }
  .day h3 {
    background: #1d4ed8; color: #fff;
    font-size: 15px; padding: 8px 12px;
  }
  .day .item {
    padding: 10px 12px;
    border-top: 1px solid #eee;
    font-size: 14px;
  }
  .day .item .slot { font-weight: bold; color: #1d4ed8; font-size: 13px; }
  .day .item .tip { color: #555; font-size: 13px; }

  .hidden { display: none; }
  .muted { color: #555; font-size: 14px; }

  button.secondary {
    background: #fff;
    color: #1d4ed8;
    border: 1px solid #1d4ed8;
  }
  button.secondary:hover { background: #eff6ff; }

  #logoutBtn {
    float: right;
    background: #1d4ed8;
    border: 1px solid #fff;
    padding: 6px 14px;
    font-size: 13px;
  }

  .chat {
    border: 1px solid #ccc;
    background: #fafafa;
    height: 320px;
    overflow-y: auto;
    padding: 12px;
    margin-bottom: 10px;
  }
  .bubble {
    max-width: 75%;
    padding: 8px 12px;
    margin-bottom: 8px;
    font-size: 14px;
    clear: both;
  }
  .bubble.buddy { background: #e5e7eb; float: left; }
  .bubble.me { background: #1d4ed8; color: #fff; float: right; }
  .chatrow { display: flex; gap: 8px; }
  .chatrow input { flex: 1; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <button id="logoutBtn" class="hidden">Log out</button>
    <h1>TravelBuddy</h1>
    <p>plan a trip with four research agents</p>
  </div>
</header>

<div class="wrap">
  <div id="errorBox" class="error"></div>

  <!-- login / register -->
  <section id="authSection" class="hidden">
    <h2>Log in or register</h2>
    <div class="row">
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com">
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="min 8 characters">
      </div>
    </div>
    <button id="loginBtn">Log in</button>
    <button id="registerBtn" class="secondary">Register</button>
  </section>

  <!-- intake chat with Buddy -->
  <section id="chatSection" class="hidden">
    <h2 id="chatTitle">Quick chat so Buddy gets to know you</h2>
    <div id="chatMessages" class="chat"></div>
    <div class="chatrow">
      <input id="chatInput" type="text" placeholder="Type your answer...">
      <button id="chatSendBtn">Send</button>
    </div>
  </section>

  <!-- step 1: preferences -->
  <section id="prefsSection" class="hidden">
    <h2>1. Trip details</h2>
    <div class="row">
      <div>
        <label for="origin">Traveling from</label>
        <input id="origin" type="text" placeholder="e.g. Mumbai">
      </div>
      <div>
        <label for="destination">Destination</label>
        <input id="destination" type="text" placeholder="e.g. Tokyo">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="startDate">Start date</label>
        <input id="startDate" type="date">
      </div>
      <div>
        <label for="endDate">End date</label>
        <input id="endDate" type="date">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="budget">Total budget (whole trip)</label>
        <input id="budget" type="number" min="1" step="any" placeholder="e.g. 2000">
      </div>
      <div style="flex: 0 0 110px; min-width: 110px;">
        <label for="currency">Currency</label>
        <select id="currency">
          <option value="USD" selected>USD $</option>
          <option value="EUR">EUR €</option>
          <option value="GBP">GBP £</option>
          <option value="INR">INR ₹</option>
          <option value="JPY">JPY ¥</option>
          <option value="AUD">AUD $</option>
          <option value="CAD">CAD $</option>
        </select>
      </div>
      <div>
        <label for="group">Group</label>
        <select id="group">
          <option value="solo">Solo</option>
          <option value="couple">Couple</option>
          <option value="friends">Friends</option>
          <option value="family">Family</option>
        </select>
      </div>
      <div>
        <label for="travelers">Travelers</label>
        <input id="travelers" type="number" min="1" max="50" value="2">
      </div>
    </div>
    <label>Vibes (pick at least one)</label>
    <div class="vibes" id="vibes"></div>
    <label>Traveling with (optional, from your saved co-travellers)</label>
    <div class="vibes" id="cotravellers"><span class="muted">none saved yet</span></div>
    <div class="row">
      <div>
        <input id="newCotName" type="text" placeholder="Name, e.g. Mom">
      </div>
      <div style="flex: 0 0 auto;">
        <button id="addCotBtn" class="secondary" type="button">Add co-traveller</button>
      </div>
    </div>
    <button id="startBtn">Start research</button>
  </section>

  <!-- step 2: research + selection -->
  <section id="researchSection" class="hidden">
    <h2>2. Recommendations</h2>
    <div id="brief" class="brief hidden"></div>
    <div id="agentStatuses"></div>
    <div id="results"></div>
    <p class="muted" id="selectHint" style="margin-top:12px">
      Click cards to select what you want in your itinerary.
    </p>
    <button id="itineraryBtn" class="hidden" disabled>Generate itinerary</button>
  </section>

  <!-- step 3: itinerary -->
  <section id="itinerarySection" class="hidden">
    <h2>3. Your itinerary</h2>
    <div id="itinerary"></div>
  </section>
</div>

<script>
var API = "";  // same origin
var VIBES = ["adventure", "culture", "food", "nightlife", "relaxation",
             "nature", "shopping", "history", "romance", "family-friendly"];

var token = localStorage.getItem("tb_token");
var chatMode = null;   // null = intake chat about the user, or a co-traveller name
var tripId = null;
var allRecs = {};      // id -> recommendation
var selectedIds = {};  // id -> true

// fetch wrapper that adds the session token
function api(path, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers["Content-Type"] = "application/json";
  if (token) {
    opts.headers["Authorization"] = "Bearer " + token;
  }
  return fetch(API + path, opts);
}

function show(id, on) {
  document.getElementById(id).classList.toggle("hidden", !on);
}

// build the vibe buttons
var vibesBox = document.getElementById("vibes");
VIBES.forEach(function (vibe) {
  var label = document.createElement("label");
  label.textContent = vibe;
  var cb = document.createElement("input");
  cb.type = "checkbox";
  cb.value = vibe;
  label.appendChild(cb);
  label.addEventListener("click", function (e) {
    e.preventDefault();
    cb.checked = !cb.checked;
    label.classList.toggle("on", cb.checked);
  });
  vibesBox.appendChild(label);
});

function showError(msg) {
  var box = document.getElementById("errorBox");
  box.textContent = msg;
  box.style.display = "block";
}

function clearError() {
  document.getElementById("errorBox").style.display = "none";
}

// read a POST SSE stream and call onEvent for each data line
async function readSSE(url, onEvent) {
  var resp = await api(url, { method: "POST" });
  if (!resp.ok) {
    var body = await resp.text();
    throw new Error("HTTP " + resp.status + ": " + body);
  }
  var reader = resp.body.getReader();
  var decoder = new TextDecoder();
  var buffer = "";
  while (true) {
    var chunk = await reader.read();
    if (chunk.done) break;
    buffer += decoder.decode(chunk.value, { stream: true });
    var parts = buffer.split("\n\n");
    buffer = parts.pop();
    for (var i = 0; i < parts.length; i++) {
      var line = parts[i].trim();
      if (line.indexOf("data: ") === 0) {
        onEvent(JSON.parse(line.slice(6)));
      }
    }
  }
}

// ---- step 1: submit preferences, start research ----

document.getElementById("startBtn").addEventListener("click", async function () {
  clearError();
  var vibes = [];
  vibesBox.querySelectorAll("input:checked").forEach(function (cb) { vibes.push(cb.value); });

  var prefs = {
    destination: document.getElementById("destination").value.trim(),
    origin: document.getElementById("origin").value.trim(),
    start_date: document.getElementById("startDate").value,
    end_date: document.getElementById("endDate").value,
    budget_amount: parseFloat(document.getElementById("budget").value),
    currency: document.getElementById("currency").value,
    vibes: vibes,
    group_type: document.getElementById("group").value,
    num_travelers: parseInt(document.getElementById("travelers").value, 10)
  };

  if (!prefs.origin || !prefs.destination || !prefs.start_date || !prefs.end_date) {
    showError("Please fill in where you're traveling from, the destination, and both dates.");
    return;
  }
  if (!prefs.budget_amount || prefs.budget_amount <= 0) {
    showError("Enter your total trip budget.");
    return;
  }
  if (vibes.length === 0) {
    showError("Pick at least one vibe.");
    return;
  }

  var btn = this;
  btn.disabled = true;
  btn.textContent = "Creating trip...";

  // saved co-travellers they ticked
  var cots = [];
  document.getElementById("cotravellers").querySelectorAll("input:checked").forEach(function (cb) {
    cots.push(cb.value);
  });
  prefs.cotravellers = cots;

  try {
    var resp = await api("/api/trip/preferences", {
      method: "POST",
      body: JSON.stringify(prefs)
    });
    var data = await resp.json();
    if (!resp.ok) {
      throw new Error(JSON.stringify(data.detail || data));
    }
    tripId = data.trip_id;
    document.getElementById("researchSection").classList.remove("hidden");
    btn.textContent = "Researching...";
    await runResearch();
  } catch (err) {
    showError(err.message);
    btn.disabled = false;
    btn.textContent = "Start research";
  }
});

var AGENTS = ["Accommodation Agent", "Activities Agent", "Restaurant Agent", "Transport Agent"];

async function runResearch() {
  var statuses = document.getElementById("agentStatuses");
  statuses.innerHTML = "";
  var statusEls = {};
  AGENTS.forEach(function (name) {
    var div = document.createElement("div");
    div.className = "agent-status working";
    div.innerHTML = '<span class="dot"></span>' + name + " — searching...";
    statuses.appendChild(div);
    statusEls[name] = div;
  });

  try {
    await readSSE("/api/trip/" + tripId + "/research", function (ev) {
      if (ev.event === "context_brief_generated") {
        var brief = document.getElementById("brief");
        brief.textContent = ev.brief;
        brief.classList.remove("hidden");
      } else if (ev.event === "agent_completed") {
        statusEls[ev.agent].className = "agent-status done";
        statusEls[ev.agent].innerHTML = '<span class="dot"></span>' + ev.agent + " — done";
        renderAgentResults(ev.agent, ev.results);
      } else if (ev.event === "agent_failed") {
        statusEls[ev.agent].className = "agent-status failed";
        statusEls[ev.agent].innerHTML = '<span class="dot"></span>' + ev.agent + " — failed";
      } else if (ev.event === "error") {
        showError("Research failed: " + ev.error);
      } else if (ev.event === "all_complete") {
        document.getElementById("itineraryBtn").classList.remove("hidden");
        var btn = document.getElementById("startBtn");
        btn.textContent = "Research complete";
      }
    });
  } catch (err) {
    showError(err.message);
    var btn = document.getElementById("startBtn");
    btn.disabled = false;
    btn.textContent = "Start research";
  }
}

function renderAgentResults(agentName, results) {
  var group = document.createElement("div");
  group.className = "agent-group";
  var h = document.createElement("h3");
  h.textContent = agentName;
  group.appendChild(h);

  results.forEach(function (rec) {
    allRecs[rec.id] = rec;
    var card = document.createElement("div");
    card.className = "card";
    card.dataset.id = rec.id;

    var reviews = rec.review_count ? " (" + rec.review_count + " reviews)" : "";

    // taste explainability: what matched, what clashed
    var breakdown = rec.score_breakdown || {};
    var tasteBits = "";
    if (breakdown.matched && breakdown.matched.length > 0) {
      tasteBits += '<div class="match">Matches your taste: ' + esc(breakdown.matched.join(", ")) + '</div>';
    }
    if (breakdown.conflicts && breakdown.conflicts.length > 0) {
      tasteBits += '<div class="conflict">⚠ Conflicts: ' + esc(breakdown.conflicts.join(" · ")) + '</div>';
    }

    card.innerHTML =
      '<div class="top">' +
        '<span class="name">' + esc(rec.name) + '</span>' +
        '<span class="badge">#' + rec.rank + ' · score ' + rec.score.toFixed(2) + '</span>' +
      '</div>' +
      '<div class="meta">' + esc(rec.location) + ' · ' + esc(rec.estimated_cost) +
        ' · ' + rec.rating + '/5' + reviews + '</div>' +
      '<div class="desc">' + esc(rec.description) + '</div>' +
      '<div class="why">Why: ' + esc(rec.reasoning) + '</div>' +
      tasteBits +
      '<div class="pick hidden">SELECTED</div>';

    card.addEventListener("click", function () {
      var id = card.dataset.id;
      if (selectedIds[id]) {
        delete selectedIds[id];
        card.classList.remove("selected");
        card.querySelector(".pick").classList.add("hidden");
      } else {
        selectedIds[id] = true;
        card.classList.add("selected");
        card.querySelector(".pick").classList.remove("hidden");
      }
      var count = Object.keys(selectedIds).length;
      var btn = document.getElementById("itineraryBtn");
      btn.disabled = count === 0;
      btn.textContent = count === 0 ? "Generate itinerary"
                                    : "Generate itinerary (" + count + " selected)";
    });

    group.appendChild(card);
  });

  document.getElementById("results").appendChild(group);
}

// ---- step 3: save selections, generate itinerary ----

document.getElementById("itineraryBtn").addEventListener("click", async function () {
  clearError();
  var btn = this;
  btn.disabled = true;
  btn.textContent = "Saving selections...";

  try {
    var resp = await api("/api/trip/" + tripId + "/select", {
      method: "POST",
      body: JSON.stringify({ selections: Object.keys(selectedIds) })
    });
    var data = await resp.json();
    if (!resp.ok) throw new Error(JSON.stringify(data.detail || data));

    btn.textContent = "Building itinerary (takes a minute)...";
    document.getElementById("itinerarySection").classList.remove("hidden");

    await readSSE("/api/trip/" + tripId + "/itinerary", function (ev) {
      if (ev.event === "itinerary_complete") {
        renderItinerary(ev.itinerary);
        btn.textContent = "Itinerary ready below";
      } else if (ev.event === "itinerary_failed") {
        showError("Itinerary failed: " + ev.error);
        btn.disabled = false;
        btn.textContent = "Generate itinerary (retry)";
      }
    });
  } catch (err) {
    showError(err.message);
    btn.disabled = false;
    btn.textContent = "Generate itinerary (retry)";
  }
});

function renderItinerary(it) {
  var box = document.getElementById("itinerary");
  box.innerHTML = "";

  var title = document.createElement("p");
  title.innerHTML = "<strong>" + esc(it.trip_title) + "</strong><br>" + esc(it.trip_summary);
  title.style.marginBottom = "14px";
  box.appendChild(title);

  it.days.forEach(function (day) {
    var dayDiv = document.createElement("div");
    dayDiv.className = "day";
    var h = document.createElement("h3");
    h.textContent = "Day " + day.day_number + " — " + day.theme + " (" + day.date + ")";
    dayDiv.appendChild(h);

    day.items.forEach(function (item) {
      var itemDiv = document.createElement("div");
      itemDiv.className = "item";
      var tip = item.tip ? '<div class="tip">Tip: ' + esc(item.tip) + "</div>" : "";
      itemDiv.innerHTML =
        '<div class="slot">' + esc(item.time_slot) + '</div>' +
        '<strong>' + esc(item.title) + '</strong> · ' + esc(item.cost_estimate) +
        '<div>' + esc(item.description) + '</div>' + tip;
      dayDiv.appendChild(itemDiv);
    });

    box.appendChild(dayDiv);
  });

  document.getElementById("itinerarySection").scrollIntoView({ behavior: "smooth" });
}

// basic html escaping so LLM text can't inject markup
function esc(s) {
  var d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

// ---- auth ----

async function doAuth(path) {
  clearError();
  var body = {
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  };
  try {
    var resp = await api(path, { method: "POST", body: JSON.stringify(body) });
    var data = await resp.json();
    if (!resp.ok) throw new Error(JSON.stringify(data.detail || data));
    token = data.token;
    localStorage.setItem("tb_token", token);
    await init();
  } catch (err) {
    showError(err.message);
  }
}

document.getElementById("loginBtn").addEventListener("click", function () {
  doAuth("/api/auth/login");
});
document.getElementById("registerBtn").addEventListener("click", function () {
  doAuth("/api/auth/register");
});
document.getElementById("logoutBtn").addEventListener("click", async function () {
  try { await api("/api/auth/logout", { method: "POST" }); } catch (err) { /* whatever, logging out anyway */ }
  localStorage.removeItem("tb_token");
  location.reload();
});

// ---- intake chat with Buddy ----

function addBubble(who, text) {
  var box = document.getElementById("chatMessages");
  var div = document.createElement("div");
  div.className = "bubble " + who;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function startChat(cotName) {
  chatMode = cotName;
  document.getElementById("chatMessages").innerHTML = "";
  document.getElementById("chatTitle").textContent =
    cotName ? "Tell Buddy about " + cotName : "Quick chat so Buddy gets to know you";
  show("chatSection", true);
  show("prefsSection", false);
  await sendChat("");  // empty message kicks off the conversation
}

async function sendChat(message) {
  if (message) addBubble("me", message);
  var btn = document.getElementById("chatSendBtn");
  btn.disabled = true;
  try {
    var resp = await api("/api/profile/chat", {
      method: "POST",
      body: JSON.stringify({ message: message, cotraveller_name: chatMode })
    });
    var data = await resp.json();
    if (!resp.ok) throw new Error(JSON.stringify(data.detail || data));
    addBubble("buddy", data.reply);
    if (data.done) {
      // sketch saved — back to the app after a beat
      setTimeout(async function () {
        show("chatSection", false);
        await init();
      }, 1500);
    }
  } catch (err) {
    showError(err.message);
  }
  btn.disabled = false;
}

document.getElementById("chatSendBtn").addEventListener("click", function () {
  var input = document.getElementById("chatInput");
  var text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendChat(text);
});
document.getElementById("chatInput").addEventListener("keydown", function (e) {
  if (e.key === "Enter") document.getElementById("chatSendBtn").click();
});

// ---- co-travellers ----

function renderCotravellers(names) {
  var box = document.getElementById("cotravellers");
  box.innerHTML = "";
  if (!names || names.length === 0) {
    box.innerHTML = '<span class="muted">none saved yet</span>';
    return;
  }
  names.forEach(function (name) {
    var label = document.createElement("label");
    label.textContent = name;
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.value = name;
    label.appendChild(cb);
    label.addEventListener("click", function (e) {
      e.preventDefault();
      cb.checked = !cb.checked;
      label.classList.toggle("on", cb.checked);
    });
    box.appendChild(label);
  });
}

document.getElementById("addCotBtn").addEventListener("click", function () {
  var name = document.getElementById("newCotName").value.trim();
  if (!name) {
    showError("Give your co-traveller a name first.");
    return;
  }
  document.getElementById("newCotName").value = "";
  startChat(name);
});

// ---- startup ----

async function init() {
  if (!token) {
    show("authSection", true);
    return;
  }
  var resp = await api("/api/auth/me");
  if (!resp.ok) {
    // stale token, back to login
    token = null;
    localStorage.removeItem("tb_token");
    show("authSection", true);
    return;
  }
  var me = await resp.json();
  show("authSection", false);
  show("logoutBtn", true);
  if (!me.intake_complete) {
    startChat(null);  // required once before planning
  } else {
    show("chatSection", false);
    show("prefsSection", true);
    renderCotravellers(me.cotravellers);
  }
}

init();
</script>
</body>
</html>
