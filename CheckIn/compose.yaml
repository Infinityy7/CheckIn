services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travelbuddy}
      POSTGRES_USER: ${POSTGRES_USER:-travelbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travelbuddy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - travelbuddy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s

  # Started only with `docker compose --profile gateway up`; app kill switch
  # is LLM_GATEWAY_ENABLED.
  llm-gateway:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    profiles: ["gateway"]
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
    volumes:
      - ./gateway/litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]

volumes:
  travelbuddy-postgres:
